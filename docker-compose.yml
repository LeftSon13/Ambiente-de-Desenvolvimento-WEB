version: '3.9'

services:
  web:
    build:
    container_name: php_web
    ports:
      - "80:80"
    volumes:
      - .www:/var/www/html
    networks:
      - webnet
    depends_on:
        - mysql
  mysql:
    image: mysql:8.4
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sistema
      MYSQL_USER: usuario
      MYSQL_PASSWORD: senha
    ports:
      - "3306:3306"
    volumes:
        - mysql_data:/var/lib/mysql

phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    restart: always
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "8080:80"
    depends_on:
      - mysql